<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--in:#059669;--out:#dc2626;--sv:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mu:#9aa1ad;--bd:#2c313a;--ac:#818cf8;--in:#34d399;--out:#f87171;--sv:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef1;--mu:#9aa1ad;--bd:#2c313a;--ac:#818cf8;--in:#34d399;--out:#f87171;--sv:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{color:var(--mu);font-size:13px}.v{font-size:20px;font-weight:700;margin-top:2px}
.in{color:var(--in)}.out{color:var(--out)}.sv{color:var(--sv)}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.cols{grid-template-columns:320px 1fr}}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
button{cursor:pointer;width:auto;background:var(--card)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin-top:14px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{width:100%;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;background:var(--out)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:500;font-size:13px}
td.r,th.r{text-align:right}
.x{border:0;background:none;color:var(--mu);padding:2px 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mu);text-align:center;padding:24px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1>💰 Catatan Keuangan</h1><p class="sub" style="margin:0"></p></div>
  <div class="btns">
    <select id="mo" style="width:auto" aria-label="Bulan"></select>
    <select id="yr" style="width:auto" aria-label="Tahun"></select>
    <button id="bx">⬇ Excel</button>
    <button id="bp">⬇ PDF</button>
  </div>
</div>

<div class="grid">
  <div class="card"><div class="k">Pemasukan</div><div class="v in" id="s-in">-</div></div>
  <div class="card"><div class="k">Pengeluaran</div><div class="v out" id="s-out">-</div></div>
  <div class="card"><div class="k">Tabungan</div><div class="v sv" id="s-sav">-</div></div>
  <div class="card"><div class="k">Sisa saldo</div><div class="v" id="s-bal">-</div></div>
</div>

<div class="cols">
  <div>
    <div class="card">
      <h2>Tambah transaksi</h2>
      <div class="seg" id="seg">
        <button data-t="out" class="on">Pengeluaran</button>
        <button data-t="in">Pemasukan</button>
        <button data-t="sav">Tabungan</button>
      </div>
      <label for="cat">Kategori</label><select id="cat"></select>
      <label for="amt">Jumlah (Rp)</label><input id="amt" type="number" inputmode="numeric" min="0" placeholder="0">
      <label for="dt">Tanggal</label><input id="dt" type="date">
      <label for="nt">Catatan (opsional)</label><input id="nt" type="text" maxlength="80">
      <button class="p" id="add">Simpan</button>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Pengeluaran per kategori</h2>
      <div id="brk"></div>
    </div>
  </div>
  <div class="card">
    <h2>Riwayat transaksi</h2>
    <div class="tw"><table>
      <thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Catatan</th><th class="r">Jumlah</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <div class="empty" id="em" hidden>Belum ada transaksi. Tambahkan yang pertama di formulir.</div>
  </div>
</div>
</main>

<script>
const CATS={
  out:["Subscription","Groceries","Household","Hutang","Investment","Other","Social","Transportation","F&B","Lifestyle","Gifts"],
  in:["Monthly Salary","Other","Piutang"],
  sav:["General Savings","Emergency Funds"]
};
const LBL={out:"Pengeluaran",in:"Pemasukan",sav:"Tabungan"};
const $=id=>document.getElementById(id);
const fmt=n=>"Rp "+Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tx=[],type="out",KEY="catatan-keuangan-v1";
try{tx=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tx=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
$("dt").value=today();

function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${esc(c)}</option>`).join("")}
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;type=b.dataset.t;
  [...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));fillCats()};

$("add").onclick=()=>{
  const a=parseFloat($("amt").value);
  if(!(a>0)){$("amt").focus();return}
  tx.push({id:Date.now()+Math.random(),t:type,c:$("cat").value,d:$("dt").value||today(),a,n:$("nt").value.trim()});
  const dd=$("dt").value||today();
  if(selY!=="all"){selY=dd.slice(0,4);if(selM!=="all")selM=dd.slice(5,7)}
  $("amt").value="";$("nt").value="";persist();render();
};
$("tb").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;
  tx=tx.filter(x=>String(x.id)!==b.dataset.id);persist();render()};
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let selY=String(new Date().getFullYear()),selM=String(new Date().getMonth()+1).padStart(2,"0");
const per=()=>selY==="all"?"all":selM==="all"?selY:selY+"-"+selM;
const perLabel=p=>p==="all"?"Semua periode":p.length===4?"Tahun "+p:monthName(p);
$("yr").onchange=()=>{selY=$("yr").value;render()};
$("mo").onchange=()=>{selM=$("mo").value;render()};

function months(){return [...new Set(tx.map(x=>x.d.slice(0,7)))].sort().reverse()}
function monthName(m){const [y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
function view(){const p=per();return tx.filter(x=>p==="all"||x.d.startsWith(p)).sort((a,b)=>b.d.localeCompare(a.d))}
function sums(list){const s={in:0,out:0,sav:0};list.forEach(x=>s[x.t]+=x.a);s.bal=s.in-s.out-s.sav;return s}

function render(){
  const yrs=[...new Set([...tx.map(x=>x.d.slice(0,4)),String(new Date().getFullYear())])].sort().reverse();
  if(selY!=="all"&&!yrs.includes(selY))selY="all";
  $("yr").innerHTML='<option value="all">Semua tahun</option>'+yrs.map(y=>`<option>${y}</option>`).join("");
  $("yr").value=selY;
  $("mo").innerHTML='<option value="all">Semua bulan</option>'+MN.map((n,i)=>`<option value="${String(i+1).padStart(2,"0")}">${n}</option>`).join("");
  $("mo").value=selM;$("mo").disabled=selY==="all";
  const list=view(),s=sums(list);
  $("s-in").textContent=fmt(s.in);$("s-out").textContent=fmt(s.out);$("s-sav").textContent=fmt(s.sav);
  $("s-bal").textContent=fmt(s.bal);$("s-bal").className="v "+(s.bal<0?"out":"in");
  $("em").hidden=list.length>0;
  $("tb").innerHTML=list.map(x=>`<tr><td>${x.d}</td><td><span class="tag">${LBL[x.t]}</span></td><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td class="r ${x.t}">${x.t==="out"?"-":x.t==="in"?"+":""}${fmt(x.a)}</td><td><button class="x" data-id="${x.id}" title="Hapus">✕</button></td></tr>`).join("");
  const by={};list.filter(x=>x.t==="out").forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("brk").innerHTML=ent.length?ent.map(([c,v])=>`<div class="row"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${(v/s.out*100).toFixed(1)}%"></i></div>`).join(""):'<div class="empty">Belum ada pengeluaran.</div>';
}

async function save(name,data){
  try{
    const dl=window.claude&&await window.claude.use("downloads");
    if(!dl){alert("Unduh tidak tersedia di tampilan ini.");return}
    await dl.save({filename:name,data});
  }catch(e){if(!e||e.code!=="declined")alert("Gagal mengunduh file.")}
}
const stamp=()=>{const p=per();return p==="all"?"semua":p};

$("bx").onclick=()=>{
  const list=view().slice().reverse(),s=sums(list);
  const rows=[["Tanggal","Jenis","Kategori","Catatan","Jumlah (Rp)"],...list.map(x=>[x.d,LBL[x.t],x.c,x.n,x.a])];
  const sum=[["Ringkasan","Jumlah (Rp)"],["Pemasukan",s.in],["Pengeluaran",s.out],["Tabungan",s.sav],["Sisa saldo",s.bal],[],["Pengeluaran per kategori","Jumlah (Rp)"]];
  CATS.out.forEach(c=>sum.push([c,list.filter(x=>x.t==="out"&&x.c===c).reduce((a,x)=>a+x.a,0)]));
  const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(rows),w2=XLSX.utils.aoa_to_sheet(sum);
  w1["!cols"]=[{wch:12},{wch:14},{wch:18},{wch:30},{wch:16}];w2["!cols"]=[{wch:26},{wch:16}];
  XLSX.utils.book_append_sheet(wb,w1,"Transaksi");XLSX.utils.book_append_sheet(wb,w2,"Ringkasan");
  save(`keuangan-${stamp()}.xlsx`,XLSX.write(wb,{type:"array",bookType:"xlsx"}));
};

$("bp").onclick=()=>{
  const list=view().slice().reverse(),s=sums(list),p=per();
  const doc=new window.jspdf.jsPDF();
  doc.setFontSize(16);doc.text("Laporan Keuangan",14,16);
  doc.setFontSize(10);doc.text("Periode: "+perLabel(p),14,23);
  doc.autoTable({startY:28,head:[["Ringkasan","Jumlah"]],body:[["Pemasukan",fmt(s.in)],["Pengeluaran",fmt(s.out)],["Tabungan",fmt(s.sav)],["Sisa saldo",fmt(s.bal)]],theme:"grid",headStyles:{fillColor:[79,70,229]},columnStyles:{1:{halign:"right"}}});
  doc.autoTable({startY:doc.lastAutoTable.finalY+8,head:[["Tanggal","Jenis","Kategori","Catatan","Jumlah"]],body:list.map(x=>[x.d,LBL[x.t],x.c,x.n,fmt(x.a)]),headStyles:{fillColor:[79,70,229]},columnStyles:{4:{halign:"right"}},styles:{fontSize:9}});
  save(`keuangan-${stamp()}.pdf`,doc.output("arraybuffer"));
};

fillCats();render();
</script>
</body>
</html>
